# Local / standalone runs from the repository root.
# The RHDP field-content runner does NOT read this file -- it supplies its own
# inventory and resolves roles from the installed collection.
[defaults]
inventory              = inventory.yml
roles_path             = roles
collections_path       = collections
callback_result_format = yaml
interpreter_python     = auto_silent
host_key_checking      = False
retry_files_enabled    = False
display_skipped_hosts  = False

# Uncomment to stop being prompted for the vault password on every run.
# Equivalent to passing --vault-password-file on the command line.
# vault_password_file = playbooks/secrets/vault-password

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
