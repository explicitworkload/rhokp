---
# RHDP Field Sourced Content entrypoint.
# Order form -> Playbook entrypoint: playbooks/deploy.yml
#
# The platform supplies the inventory (groups `bastions` and `nodes`, with
# ansible_become=true for all hosts) and the extra-vars `guid`, `subdomain` and
# `field_asset.*`. Plays below follow the template's conventions: an empty host
# list skips a play, because `when:` is not valid on a play.

- name: Deploy the Red Hat Offline Knowledge Portal on the first workload node
  hosts: "{{ groups['nodes'][0] if groups['nodes'] | default([]) | length > 0 else [] }}"
  become: true
  gather_facts: true
  vars:
    # The RHDP inventory sets ansible_become=true for every host, so facts are
    # gathered as root and a rootless install would land in /root. Rootful is
    # the correct model on these ephemeral workload nodes.
    rhokp_rootless: false

    # Nothing outside the bastion can reach this node, so bind wide and let the
    # bastion nginx be the only way in.
    rhokp_bind_address: "0.0.0.0"

    # The bastion proxies plain HTTP; the Route terminates TLS at the edge.
    # Publishing 8443 from the container as well costs nothing and lets you
    # reach the portal's own HTTPS listener directly from the bastion.
    rhokp_publish_https: true

    # Node sizes go down to "small". Let the portal use what the node has
    # rather than asserting caps the VM may not be able to honour.
    rhokp_apply_resource_limits: false

    # Degrade instead of failing when no credentials were committed: install
    # everything, leave the portal stopped, and let an operator finish with
    # `sudo /usr/sbin/rhokp-set-credentials`.
    rhokp_require_credentials: false

    # Optional, and worth setting. The image is ~7.8 GB, and without a pull
    # secret at provision time that download happens later, while someone sits
    # watching `rhokp-set-credentials`. A pull secret configured on the catalog
    # item moves it into the provision window instead; the helper then only
    # asks for an access key. A pull secret only gets you the *image*, which
    # anyone with Red Hat registry credentials can do; the Knowledgebase
    # content and search index still need a per-person access key.
    #
    # Set it as base64 (`base64 -w0 pull-secret.json`), because a pull secret is
    # multi-line JSON and neither the order form nor extra-vars.yml handles that
    # well. field_asset may be undefined entirely on a hand-run, hence the
    # default({}).
    rhokp_pull_secret_b64: "{{ (field_asset | default({})).pull_secret_b64 | default('') }}"
  roles:
    - rhokp

- name: Route the catalog Routes to the portal
  hosts: "{{ groups['bastions'] if (field_asset.enable_bastion_proxy | default(false) | bool) else [] }}"
  become: true
  gather_facts: true
  vars:
    rhokp_bastion_proxy_target: "{{ groups['nodes'][0] }}"
    rhokp_bastion_proxy_port: 8080
  roles:
    - rhokp_bastion_proxy
