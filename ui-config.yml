---
type: showroom

default_width: 30
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

tabs:
  # Tab URLs substitute ${GUID} and ${DOMAIN} at runtime. This is shell-style
  # syntax, NOT the AsciiDoc {attribute} syntax used inside content pages --
  # using the latter here leaves the braces literal and the tab fails with
  # "server IP address could not be found".
  - name: Portal
    url: 'https://app-secure-${GUID}.${DOMAIN}'

  - name: Terminal
    path: /wetty
    port: 443
