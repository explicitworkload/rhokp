---
type: showroom

# Percentage width of one pane; the other fills the rest. 50 gives an even
# split either way. Readers can still drag the divider, and persist_url_state
# remembers where they left it (it rides along in the URL as ?w=NN).
default_width: 50
persist_url_state: true

view_switcher:
  enabled: true
  default_mode: split

# There is deliberately no "Portal" tab.
#
# Tab URLs substitute only ${GUID} and ${DOMAIN}, shell-style -- not the
# AsciiDoc {attribute} syntax used in content pages. Reference:
# https://github.com/rhpds/showroom_template_nookbag/blob/main/content/modules/ROOT/pages/ui-config.adoc
#
# That reference describes ${DOMAIN} as "the apps domain of the OpenShift
# cluster". On this RHEL Field Asset it is not. Measured on a live order, with
# GUID 6wrqg on cluster ocpv07:
#
#   url: 'https://app-secure-${GUID}.${DOMAIN}'
#     -> https://app-secure-6wrqg.bastion-6wrqg.apps.ocpv07.rhdp.net
#
# ${DOMAIN} expands to Showroom's own route host, bastion-<guid>.<apps domain>,
# so the portal's hostname cannot be built from it -- there is no way to strip
# the leading "bastion-<guid>." and no other variable is available. Hardcoding
# the apps domain would break on every other cluster.
#
# So the guide sends the reader to the URL on their order page instead, and
# checks the portal from the Terminal tab, which does work.
tabs:
  - name: Terminal
    path: /wetty
    port: 443
