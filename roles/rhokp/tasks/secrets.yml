---
# The ACCESS_KEY never lands on the target as a plain file. It is decrypted from
# Ansible Vault on the control node, pushed over SSH, and stored as a podman
# secret. The quadlet unit then injects it as an env var at container start.

- name: Reject an empty access key
  ansible.builtin.assert:
    that: rhokp_access_key | trim | length > 0
    fail_msg: "The resolved RHOKP access key is empty."
    quiet: true

- name: Ensure the rhokp state directory exists
  ansible.builtin.file:
    path: "{{ _rhokp_conf_dir }}"
    state: directory
    mode: "0700"
  become: "{{ _rhokp_become }}"

# A fingerprint sidecar keeps the run idempotent: podman cannot tell us whether
# a secret's contents changed, so we track it ourselves instead of recreating
# (and therefore restarting) the portal on every run.
- name: Read the fingerprint of the installed access key
  ansible.builtin.slurp:
    src: "{{ _rhokp_conf_dir }}/access-key.sha256"
  register: _rhokp_fingerprint_raw
  become: "{{ _rhokp_become }}"
  failed_when: false

- name: Check whether the podman secret still exists
  ansible.builtin.command: "podman secret inspect {{ rhokp_access_key_secret_name }}"
  register: _rhokp_secret_inspect
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  changed_when: false
  failed_when: false
  no_log: true

- name: Compare wanted and installed access keys
  ansible.builtin.set_fact:
    _rhokp_fingerprint_want: "{{ rhokp_access_key | trim | hash('sha256') }}"
    _rhokp_fingerprint_have: >-
      {{ (_rhokp_fingerprint_raw.content | b64decode | trim)
         if (_rhokp_fingerprint_raw.content is defined) else '' }}

- name: Decide whether the podman secret needs rewriting
  ansible.builtin.set_fact:
    _rhokp_secret_changed: >-
      {{ _rhokp_secret_inspect.rc != 0
         or _rhokp_fingerprint_have != _rhokp_fingerprint_want }}

- name: Rotate the access key
  when: _rhokp_secret_changed | bool
  block:
    - name: Stop the portal before rotating a key it is already using
      ansible.builtin.systemd_service:
        name: "{{ _rhokp_unit }}"
        scope: "{{ _rhokp_scope }}"
        state: stopped
      become: "{{ _rhokp_become }}"
      environment: "{{ _rhokp_env }}"
      when: _rhokp_fingerprint_have | length > 0
      failed_when: false

    - name: Create the podman secret holding ACCESS_KEY
      containers.podman.podman_secret:
        name: "{{ rhokp_access_key_secret_name }}"
        data: "{{ rhokp_access_key | trim }}"
        state: present
        force: true
      become: "{{ _rhokp_become }}"
      environment: "{{ _rhokp_env }}"
      no_log: true
      notify: Restart rhokp

    - name: Record the new fingerprint
      ansible.builtin.copy:
        content: "{{ _rhokp_fingerprint_want }}\n"
        dest: "{{ _rhokp_conf_dir }}/access-key.sha256"
        mode: "0600"
      become: "{{ _rhokp_become }}"
