---
# Resolve the access key and the registry pull secret on the CONTROL NODE,
# trying each source in turn:
#
#   1. Already supplied as extra-vars (-e rhokp_access_key=... /
#      _pull_secret_path / _pull_secret_b64)
#   2. Vault files + a vault password file committed next to them.
#      This is the RHDP path: the field-content runner invokes ansible-playbook
#      with no --vault-password-file, so native vault decryption never happens
#      and we have to shell out to ansible-vault ourselves.
#   3. Vault files decrypted by Ansible's own configured vault secret.
#      This is the standalone path: --vault-password-file / --ask-vault-pass.
#   4. Nothing. Fall through to degraded mode -- install everything that does
#      not need credentials and leave the portal awaiting them.
#
# The `is file` tests and every lookup() below are evaluated by the templating
# engine on the control node, so they need no connection. Only the two
# ansible-vault calls are real local tasks, and those must defeat the RHDP
# inventory's ansible_become=true -- that connection variable outranks the
# `become:` keyword, so it has to be overridden as a var, not a keyword.

# The two credentials are resolved independently and are useful on their own.
# A pull secret with no access key is worth having: it lets the 7.8 GB image be
# downloaded now, so whoever finishes the install later only has to paste a key.

# --- source 1 (early): a base64-wrapped pull secret -------------------------
# A pull secret is multi-line JSON, and the places that can hand us one at
# provision time -- an RHDP catalog-item variable, /opt/field-content/extra-vars.yml,
# a -e on the command line -- are all single-line-friendly at best. Decoding it
# first means every `when:` guard below sees a resolved rhokp_pull_secret.

- name: Decode a base64-wrapped pull secret
  ansible.builtin.set_fact:
    rhokp_pull_secret: "{{ rhokp_pull_secret_b64 | b64decode }}"
  no_log: true
  when:
    - rhokp_pull_secret | default('') | trim | length == 0
    - rhokp_pull_secret_b64 | default('') | trim | length > 0

- name: Note whether a committed vault password file is present
  ansible.builtin.set_fact:
    _rhokp_vault_pw_present: "{{ rhokp_vault_password_file is file }}"

# --- source 2: committed vault password ------------------------------------

- name: Decrypt the vault files with the committed vault password
  when: _rhokp_vault_pw_present | bool
  delegate_to: localhost
  vars:
    ansible_connection: local
    ansible_become: false
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  block:
    - name: Decrypt the access key
      ansible.builtin.command:
        argv:
          - ansible-vault
          - decrypt
          - "--vault-password-file={{ rhokp_vault_password_file }}"
          - "--output=-"
          - "{{ rhokp_access_key_file }}"
      register: _rhokp_dec_key
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - rhokp_access_key is not defined or rhokp_access_key | length == 0
        - rhokp_access_key_file is file

    - name: Decrypt the pull secret
      ansible.builtin.command:
        argv:
          - ansible-vault
          - decrypt
          - "--vault-password-file={{ rhokp_vault_password_file }}"
          - "--output=-"
          - "{{ rhokp_pull_secret_file }}"
      register: _rhokp_dec_pull
      changed_when: false
      failed_when: false
      no_log: true
      when:
        - rhokp_pull_secret is not defined or rhokp_pull_secret | length == 0
        - rhokp_pull_secret_path is not defined
        - rhokp_pull_secret_file is file

- name: Adopt the decrypted access key
  ansible.builtin.set_fact:
    rhokp_access_key: "{{ _rhokp_dec_key.stdout }}"
  no_log: true
  when:
    - _rhokp_dec_key.rc | default(1) == 0
    - _rhokp_dec_key.stdout | default('') | trim | length > 0

- name: Adopt the decrypted pull secret
  ansible.builtin.set_fact:
    rhokp_pull_secret: "{{ _rhokp_dec_pull.stdout }}"
  no_log: true
  when:
    - _rhokp_dec_pull.rc | default(1) == 0
    - _rhokp_dec_pull.stdout | default('') | trim | length > 0

# --- source 3: Ansible's own vault secret ----------------------------------

- name: Decrypt the access key with Ansible's configured vault secret
  when:
    - rhokp_access_key is not defined or rhokp_access_key | length == 0
    - rhokp_access_key_file is file
  block:
    - name: Unvault the access key
      ansible.builtin.set_fact:
        rhokp_access_key: "{{ lookup('ansible.builtin.unvault', rhokp_access_key_file) }}"
      no_log: true
  rescue:
    - name: No vault secret available for the access key
      ansible.builtin.debug:
        msg: "Could not decrypt {{ rhokp_access_key_file }} -- no vault password available."

- name: Decrypt the pull secret with Ansible's configured vault secret
  when:
    - rhokp_pull_secret is not defined or rhokp_pull_secret | length == 0
    - rhokp_pull_secret_path is not defined
    - rhokp_pull_secret_file is file
  block:
    - name: Unvault the pull secret
      ansible.builtin.set_fact:
        rhokp_pull_secret: "{{ lookup('ansible.builtin.unvault', rhokp_pull_secret_file) }}"
      no_log: true
  rescue:
    - name: No vault secret available for the pull secret
      ansible.builtin.debug:
        msg: "Could not decrypt {{ rhokp_pull_secret_file }} -- no vault password available."

# --- source 1 (late): explicit plaintext path ------------------------------

- name: Read the pull secret from an explicit path
  ansible.builtin.set_fact:
    rhokp_pull_secret: "{{ lookup('ansible.builtin.file', rhokp_pull_secret_path) }}"
  no_log: true
  when:
    - rhokp_pull_secret is not defined or rhokp_pull_secret | length == 0
    - rhokp_pull_secret_path is defined

# --- verdict ---------------------------------------------------------------

- name: Record which credentials were resolved
  ansible.builtin.set_fact:
    _rhokp_have_pull_secret: "{{ rhokp_pull_secret | default('') | trim | length > 0 }}"
    _rhokp_have_access_key: "{{ rhokp_access_key | default('') | trim | length > 0 }}"

# Only both together can start the portal: the pull secret fetches the image,
# the access key unlocks the content. Each half still earns its keep alone --
# see the gating in main.yml.
- name: Record whether both credentials were resolved
  ansible.builtin.set_fact:
    _rhokp_have_credentials: >-
      {{ (_rhokp_have_access_key | bool) and (_rhokp_have_pull_secret | bool) }}

- name: Fail when credentials are required but missing
  ansible.builtin.assert:
    that: _rhokp_have_credentials | bool
    fail_msg: |
      Could not resolve the RHOKP credentials, and rhokp_require_credentials is true.

      Supply them one of these ways:
        * scripts/init-secrets.sh, then run with --vault-password-file
        * commit playbooks/secrets/vault-password (private repos only -- see README)
        * -e rhokp_access_key='<key>' -e rhokp_pull_secret_path=./pull-secret.json
        * -e rhokp_pull_secret_b64="$(base64 -w0 pull-secret.json)"
    quiet: true
  when: rhokp_require_credentials | bool

- name: Warn that only the access key is missing
  ansible.builtin.debug:
    msg:
      - "No RHOKP access key available, so the portal will be left stopped."
      - "The image is pre-pulled below, so finishing the install is quick:"
      - "  sudo {{ rhokp_helper_path }}      # asks for the access key only"
  when:
    - not (_rhokp_have_credentials | bool)
    - _rhokp_have_pull_secret | bool

- name: Warn that the portal will be installed but not started
  ansible.builtin.debug:
    msg:
      - "No RHOKP credentials available, so the image cannot be pre-pulled."
      - "Whoever finishes this install waits out a 7.8 GB download first."
      - "To pre-pull it here instead, supply a pull secret at deploy time --"
      - "see 'Pre-pulling the image' in the README."
      - "Finish the deploy on the node with:  sudo {{ rhokp_helper_path }}"
  when:
    - not (_rhokp_have_credentials | bool)
    - not (_rhokp_have_pull_secret | bool)
