---
# Always installed, not just in the degraded path -- it is also the quickest way
# to rotate credentials by hand on a node you are already logged into.
- name: Install the rhokp-set-credentials helper
  ansible.builtin.template:
    src: rhokp-set-credentials.j2
    dest: "{{ rhokp_helper_path }}"
    mode: "0755"
  become: true

# Earlier revisions put it in /usr/local/bin, which is outside RHEL's sudo
# secure_path. Remove the stale copy so there is only one.
- name: Remove the helper from the pre-1.0 location
  ansible.builtin.file:
    path: /usr/local/bin/rhokp-set-credentials
    state: absent
  become: true
  when: rhokp_helper_path != '/usr/local/bin/rhokp-set-credentials'
