---
# The unit may only name the podman secret if that secret actually exists --
# Quadlet refuses to start a container whose Secret= target is missing. The
# node is the source of truth rather than this run's variables, because
# rhokp-set-credentials may have added or removed the key since the last
# deploy, and reading it back here is what keeps the two from fighting.
- name: Check whether the access-key secret exists on the host
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - "{{ rhokp_access_key_secret_name }}"
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  register: _rhokp_secret_present
  changed_when: false
  failed_when: false
  no_log: true

- name: Decide whether the unit should reference the podman secret
  ansible.builtin.set_fact:
    _rhokp_unit_wants_secret: >-
      {{ (_rhokp_have_access_key | default(false) | bool)
         or (_rhokp_secret_present.rc == 0) }}

- name: Note a deliberately key-less install
  ansible.builtin.debug:
    msg: >-
      No access key on this host, so the unit is written without a Secret=
      line. RHOKP will run in limited-access mode. Add a key at any time with
      `sudo {{ rhokp_helper_path }}`.
  when: not (_rhokp_unit_wants_secret | bool)

- name: Check whether the portal is already installed
  ansible.builtin.stat:
    path: "{{ _rhokp_quadlet_dir }}/{{ rhokp_service_name }}.container"
  register: _rhokp_existing_unit
  become: "{{ _rhokp_become }}"

- name: Note whether this is a first install
  ansible.builtin.set_fact:
    _rhokp_fresh_install: "{{ not _rhokp_existing_unit.stat.exists }}"

- name: Ensure the quadlet directory exists
  ansible.builtin.file:
    path: "{{ _rhokp_quadlet_dir }}"
    state: directory
    mode: "0755"
  become: "{{ _rhokp_become }}"

- name: Install the rhokp quadlet unit
  ansible.builtin.template:
    src: rhokp.container.j2
    dest: "{{ _rhokp_quadlet_dir }}/{{ rhokp_service_name }}.container"
    mode: "0644"
  become: "{{ _rhokp_become }}"
  register: _rhokp_unit_file
  notify: Restart rhokp

- name: Reload systemd so the quadlet generator picks up the unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ _rhokp_scope }}"
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  when: _rhokp_unit_file is changed

# Quadlet-generated units are enabled through [Install] in the .container file,
# not through `systemctl enable`, so only the start is driven from here.
# Without credentials the image is absent and the unit would crash-loop, so the
# unit is installed but left stopped for rhokp-set-credentials to start.
- name: Start the portal
  ansible.builtin.systemd_service:
    name: "{{ _rhokp_unit }}"
    scope: "{{ _rhokp_scope }}"
    state: started
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  when: _rhokp_have_credentials | bool
