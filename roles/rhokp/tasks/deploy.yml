---
- name: Check whether the portal is already installed
  ansible.builtin.stat:
    path: "{{ _rhokp_quadlet_dir }}/{{ rhokp_service_name }}.container"
  register: _rhokp_existing_unit
  become: "{{ _rhokp_become }}"

- name: Note whether this is a first install
  ansible.builtin.set_fact:
    _rhokp_fresh_install: "{{ not _rhokp_existing_unit.stat.exists }}"

- name: Ensure the quadlet directory exists
  ansible.builtin.file:
    path: "{{ _rhokp_quadlet_dir }}"
    state: directory
    mode: "0755"
  become: "{{ _rhokp_become }}"

- name: Install the rhokp quadlet unit
  ansible.builtin.template:
    src: rhokp.container.j2
    dest: "{{ _rhokp_quadlet_dir }}/{{ rhokp_service_name }}.container"
    mode: "0644"
  become: "{{ _rhokp_become }}"
  register: _rhokp_unit_file
  notify: Restart rhokp

- name: Reload systemd so the quadlet generator picks up the unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: "{{ _rhokp_scope }}"
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  when: _rhokp_unit_file is changed

# Quadlet-generated units are enabled through [Install] in the .container file,
# not through `systemctl enable`, so only the start is driven from here.
# Without credentials the image is absent and the unit would crash-loop, so the
# unit is installed but left stopped for rhokp-set-credentials to start.
- name: Start the portal
  ansible.builtin.systemd_service:
    name: "{{ _rhokp_unit }}"
    scope: "{{ _rhokp_scope }}"
    state: started
  become: "{{ _rhokp_become }}"
  environment: "{{ _rhokp_env }}"
  when: _rhokp_have_credentials | bool
