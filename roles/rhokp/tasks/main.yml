---
- name: Resolve deployment mode
  ansible.builtin.import_tasks: mode.yml
  tags: [always]

- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml
  tags: [rhokp, preflight]

- name: Resolve credentials
  ansible.builtin.import_tasks: resolve_secrets.yml
  tags: [rhokp, secrets]

- name: Install secret material
  ansible.builtin.import_tasks: secrets.yml
  when: _rhokp_have_access_key | default(false) | bool
  tags: [rhokp, secrets]

# Gated on the pull secret alone, not on both credentials. The image is 7.8 GB
# and downloading it is the slowest part of the whole install by a wide margin,
# so it is worth doing here whenever we can -- even when no access key turned up
# and the portal will be left stopped. rhokp-set-credentials then finds the
# image already present and finishes in seconds instead of minutes.
- name: Pull the portal image
  ansible.builtin.import_tasks: image.yml
  when: _rhokp_have_pull_secret | default(false) | bool
  tags: [rhokp, image]

- name: Deploy the quadlet unit
  ansible.builtin.import_tasks: deploy.yml
  tags: [rhokp, deploy]

- name: Install the credential helper
  ansible.builtin.import_tasks: helper.yml
  tags: [rhokp, deploy]

- name: Open the firewall
  ansible.builtin.import_tasks: firewall.yml
  when: rhokp_manage_firewall | bool
  tags: [rhokp, firewall]

- name: Wait for the portal to become ready
  ansible.builtin.import_tasks: verify.yml
  when:
    - rhokp_wait_for_ready | bool
    - (_rhokp_have_credentials | default(false) | bool)
      or (_rhokp_was_active | default(false) | bool)
  tags: [rhokp, verify]

- name: Explain how to finish a credential-less install
  ansible.builtin.debug:
    msg:
      - "RHOKP is installed but NOT running -- no access key was available."
      - "On {{ inventory_hostname }}, run:  sudo {{ rhokp_helper_path }}"
      - >-
        {{ 'The image is already pulled, so it only asks for the access key.'
           if _rhokp_have_pull_secret | default(false) | bool
           else 'It asks for a pull secret (7.8 GB download) and an access key.' }}
  when:
    - not (_rhokp_have_credentials | default(false) | bool)
    - not (_rhokp_was_active | default(false) | bool)
  tags: [rhokp, verify]
